<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendário de Reservas</title>
  <!-- Lato: a mesma letra do formulário. O widget vive num iframe de outra
       origem, por isso não herda nada do JotForm — tem de a carregar sozinho. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Escolha a data</h2>
  <input type="date" id="datePicker">

  <div id="slots" hidden>
    <h3>Horários disponíveis</h3>
    <div id="slotsList"></div>
  </div>

  <div id="estado"></div>
  <div id="debug" hidden></div>

  <!-- JotForm Custom Widget API -->
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <script src="widget.js"></script>
</body>
</html>
